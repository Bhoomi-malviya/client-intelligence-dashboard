kind = "web"
previewPath = "/"
title = "FUME AI Client Intelligence Dashboard"
version = "1.0.0"
id = "artifacts/fume-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23786

[services.development]
run = "pnpm --filter @workspace/fume-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fume-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/fume-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23786"
BASE_PATH = "/"
